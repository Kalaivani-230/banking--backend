spring.application.name=MiniProject

# =========================
# Server
# =========================
server.port=8080

# =========================
# MySQL Database
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/finance_tracker?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# Swagger (Springdoc OpenAPI)
# =========================
springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/api-docs

# =========================
# App Custom Config
# =========================

# JWT
app.jwt.secret=cbft_2026_super_secure_secret_key_1234567890
app.jwt.expiryMinutes=60

# OTP
app.otp.expirySeconds=120
app.otp.resendCooldownSeconds=30

# Fee Quote
app.quote.expirySeconds=120

logging.level.org.springframework.security=DEBUG